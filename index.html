pets:[],events:[],ads:[
{id:'a1',tipo:'Perdido',nome:'Thor',esp:'Cachorro',local:'Centro',desc:'Vira-lata caramelo, coleira azul. Visto pela última vez perto da praça.',mine:0},

{id:'a3',tipo:'Adoção',nome:'Bidu',esp:'Cachorro',local:'Rio Grande',desc:'Filhote de 4 meses, porte médio, vermifugado.',mine:0}]};

function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmpFoto=c.toDataURL('image/jpeg',.8);R()};im.onerror=()=>{S.err='Não foi possível ler essa imagem. Tente outra foto.';R()};im.src=r.result};r.readAsDataURL(f)}
function go(v,x){S.view=v;S.sheet=null;S.err='';S.msg='';if(x)Object.assign(S,x);R()}
function sheet(s){S.sheet=s;S.err='';tmpFoto=(s&&s.t=='pet'&&s.id)?(pet(s.id).foto||''):(s&&s.t=='donoF'?(S.user.foto||''):'');R()}
function age(n){if(!n)return'';const m=Math.floor((Date.now()-new Date(n))/2629800000);return m>=12?Math.floor(m/12)+' anos':m+' meses'}

/* Tela 1 */
function auth(){const m=S.mode,E=S.err?`<div class="err" role="alert">${h(S.err)}</div>`:'',M=S.msg?`<div class="msg">${h(S.msg)}</div>`:'';
return `<div style="padding-top:40px"><div style="font-size:44px">🐾</div><h1>Patinha</h1><p class="mute">Saúde e rotina do seu pet em um só lugar.</p>${E}${M}
<form onsubmit="event.preventDefault();doAuth()">
${m=='signup'?`<label for="n">Nome</label><input id="n" autocomplete="name">`:''}
${m=='signup'?`<label for="ci">Cidade</label><input id="ci" autocomplete="address-level2" placeholder="Ex.: Belo Horizonte">`:''}<label for="em">E-mail</label><input id="em" type="email" autocomplete="email">
${m!='forgot'?`<label for="pw">Senha</label><input id="pw" type="password" autocomplete="${m=='login'?'current-password':'new-password'}">`:''}
${m=='signup'?`<label class="ck"><input id="tm" type="checkbox"><span>Li e aceito os <button type="button" class="lnk" onclick="sheet({t:'doc',k:'Termos de uso'})">Termos de uso</button> e a <button type="button" class="lnk" onclick="sheet({t:'doc',k:'Política de privacidade'})">Política de privacidade</button>.</span></label>`:''}
<button class="w">${m=='login'?'Entrar':m=='signup'?'Criar conta':'Enviar link de recuperação'}</button></form>
<div class="row sp" style="margin-top:14px">${m=='login'?`<button class="lnk" onclick="go('auth',{mode:'forgot'})">Esqueci a senha</button><button class="lnk" onclick="go('auth',{mode:'signup'})">Criar conta</button>`:`<button class="lnk" onclick="go('auth',{mode:'login'})">Voltar para o login</button>`}</div>
<p class="mute" style="margin-top:20px">Pedimos nome, cidade, e-mail e senha para criar sua conta. A cidade pode ajudar a organizar serviços e anúncios da sua região.</p></div>`}
function maskCpf(i){const d=i.value.replace(/\D/g,'').slice(0,11);i.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')}
function cpfOk(c){const d=c.replace(/\D/g,'');if(d.length!=11||/^(\d)\1+$/.test(d))return false;for(const n of[9,10]){let s=0;for(let i=0;i<n;i++)s+=d[i]*(n+1-i);if((s*10%11)%10!=d[n])return false}return true}
async function doAuth(){const m=S.mode,em=$('em').value.trim();
if(!/^\S+@\S+\.\S+$/.test(em))return S.err='Informe um e-mail válido.',R();
if(m=='forgot')return S.err='',S.msg='Se o e-mail estiver cadastrado, enviaremos um link para criar nova senha.',R();
const pw=$('pw').value;if(pw.length<8)return S.err='A senha precisa ter ao menos 8 caracteres.',R();
let nome=em.split('@')[0],cid='';
if(m=='signup'){nome=$('n').value.trim();if(!nome)return S.err='Informe seu nome.',R();cid=$('ci').value.trim();if(!cid)return S.err='Informe sua cidade.',R();if(!$('tm').checked)return S.err='Para criar a conta, aceite os termos e a política de privacidade.',R()}
try{if(m=='signup'){const {data,error}=await db.auth.signUp({email:em,password:pw,options:{data:{nome,cidade:cid}}});if(error)throw error;if(!data.session){S.msg='Conta criada! Confira seu e-mail para confirmar o cadastro e depois entre no Patinha.';return R()}currentUser=data.user;}else{const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});if(error)throw error;currentUser=data.user;}await openUserData();}catch(e){S.err=e.message||'Não foi possível entrar. Confira seus dados.';R()}}
async function openUserData(){
 const {data:{user},error}=await db.auth.getUser(); if(error)throw error; currentUser=user;
 const meta=user.user_metadata||{}; S.user={nome:meta.nome||user.email.split('@')[0],email:user.email,tel:'',cidade:meta.cidade||'',foto:'',msgs:true};
 const {data,error:readError}=await db.from('pets').select('local_id,app_data').eq('user_id',user.id); if(readError)throw readError;
 S.pets=(data||[]).map(row=>({...row.app_data,id:row.local_id})); S.events=[]; S.fam=[]; S.view='home'; S.mode='login'; S.err=''; S.msg=''; R();
}
async function persistPet(p){if(!currentUser)throw new Error('Entre na sua conta para salvar os pets.');
 const copy={...p}; delete copy.foto;
 const row={user_id:currentUser.id,local_id:String(p.id),nome:p.nome,especie:p.esp||'Outro',raca:p.raca||null,sexo:p.sexo||null,data_nascimento:p.nasc||null,peso:p.peso?Number(String(p.peso).replace(',','.')):null,observacoes:null,app_data:copy};
 const {error}=await db.from('pets').upsert(row,{onConflict:'user_id,local_id'}); if(error)throw error;
}

async function savePet(id){const n=$('pn').value.trim();if(!n)return S.err='Informe o nome do pet.',R();

const openInv=()=>sheet({t:'inv'}),famOk=i=>sheet({t:'famP',i}),famDel=i=>{S.fam.splice(i,1);R()},famAcc=i=>{const m=S.fam[i];m.st='ativo';m.nome=m.nome||m.email.split('@')[0];R()};
function famSec(){const F=S.fam||[],pd=F.filter(m=>m.st=='pedido'),rest=F.filter(m=>m.st!='pedido');
return `<h2>Família e acesso compartilhado</h2><div class='card'><div class='row sp'><b>${h(S.user.nome)}</b><span class='tag'>Responsável principal</span></div><p class='mute'>Você decide quem acessa os pets. Só quem você autorizar vê os dados, e você pode remover o acesso quando quiser.</p>${pd.map(m=>`<div class='card' style='border-color:var(--sun)'><b>${h(m.nome)}</b> pediu acesso<div class='mute'>${h(m.email)}</div><div class='row' style='margin-top:8px'><button class='sm' onclick='famOk(${F.indexOf(m)})'>Autorizar</button><button class='sm d' onclick='famDel(${F.indexOf(m)})'>Recusar</button></div></div>`).join('')}${rest.map(m=>`<div class='row sp' style='padding:8px 0;border-top:1px dashed var(--line)'><div class='grow'><b>${h(m.nome||m.email)}</b><div class='mute'>${h(m.email)}</div><span class='tag ${m.st=='ativo'?'':'p'}'>${m.st=='ativo'?'Acesso ativo':'Convite enviado'}</span> <span class='tag'>${m.papel}</span></div><div style='display:grid;gap:6px'>${m.st=='ativo'?`<button class='sm s' onclick='famOk(${F.indexOf(m)})'>Alterar permissão</button>`:`<button class='sm s' onclick='famAcc(${F.indexOf(m)})'>Simular aceite</button>`}<button class='sm g' onclick='famDel(${F.indexOf(m)})'>Remover</button></div></div>`).join('')}<button class='w' style='margin-top:10px' onclick='openInv()'>+ Convidar pessoa</button></div><div class='card mute' style='font-size:14px'><b style='color:var(--ink)'>O que cada permissão faz</b><br>Visualizador: vê pets, vacinas e agenda.<br>Editor: também registra vacinas, saúde e eventos.<br>Só o responsável principal exclui pets, gerencia pessoas e altera a conta.</div>`}
function famPForm(){const m=S.fam[S.sheet.i];return `<h2>${m.st=='pedido'?'Autorizar acesso':'Alterar permissão'}</h2><p class='mute'>${h(m.nome||m.email)} · ${h(m.email)}</p><label for='fr'>Permissão</label><select id='fr'><option ${m.papel=='Visualizador'?'selected':''}>Visualizador</option><option ${m.papel=='Editor'?'selected':''}>Editor</option></select><button class='w' onclick='saveFam()'>${m.st=='pedido'?'Autorizar':'Salvar'}</button><button class='w g' onclick='sheet(null)'>Cancelar</button>`}
function saveFam(){const m=S.fam[S.sheet.i];m.papel=$('fr').value;m.st='ativo';S.sheet=null;S.msg='Permissão atualizada.';R()}
function invForm(){return `<h2>Convidar pessoa</h2>${S.err?`<div class='err'>${S.err}</div>`:''}<p class='mute'>Ex.: seu parceiro ou sua parceira, ou alguém da família que cuida do pet. A pessoa precisa aceitar o convite.</p><form onsubmit='event.preventDefault();saveInv()'><label for='ie'>E-mail da pessoa</label><input id='ie' type='email'><label for='ir'>Permissão</label><select id='ir'><option>Editor</option><option>Visualizador</option></select><button class='w'>Enviar convite</button></form><button class='w g' onclick='sheet(null)'>Cancelar</button>`}
function saveInv(){const e=$('ie').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return S.err='Informe um e-mail válido.',R();if(e==S.user.email.toLowerCase()||S.fam.some(m=>m.email==e))return S.err='Essa pessoa já está na lista.',R();S.fam.push({id:uid(),nome:'',email:e,papel:$('ir').value,st:'convite'});S.sheet=null;S.msg='Convite enviado para '+e+'.';R()}
let scan={st:'',recs:[],msg:''};
const isoD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s:'';
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no({code:'image_rejected'});r.onload=()=>{const im=new Image();im.onerror=()=>no({code:'image_rejected'});im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no({code:'image_rejected'}),'image/jpeg',.85)};im.src=r.result};r.readAsDataURL(f)})}
async function readCard(inp){const f=inp.files[0];if(!f)return;scan={st:'load',recs:[],msg:''};R();
try{const sample=await claude.use('sample');if(!sample)throw{code:'none'};const lim=await sample.limits();if(!lim.images)throw{code:'images_unavailable'};const blob=await shrink(f),p=pet(S.petId);
const r=await sample.json('Esta é a foto de um cartão de vacinação de um(a) '+p.esp.toLowerCase()+'. Leia as vacinas registradas e responda SOMENTE com um array JSON. Cada item: {"n": nome da vacina, "dose": uma de "1ª dose", "2ª dose", "3ª dose", "Reforço", "Anual" ou "", "d": data de aplicação AAAA-MM-DD, "lote": lote ou "", "vet": veterinário ou "", "prox": data da próxima dose AAAA-MM-DD ou ""}. Use "" quando algo não estiver legível e nunca invente dados. Se a imagem não for um cartão de vacina, responda [].',{images:[blob],modelTier:'default'});
scan={st:'ok',msg:'',recs:(Array.isArray(r)?r:[]).filter(x=>x&&x.n).map(x=>({n:String(x.n),dose:String(x.dose||''),d:isoD(x.d),lote:String(x.lote||''),vet:String(x.vet||''),prox:isoD(x.prox),on:true}))}}
catch(e){const c=e&&e.code;scan={st:'err',recs:[],msg:c=='cancelled'?'':c=='rate_limited'?'Muitas tentativas seguidas. Tente de novo em instantes.':c=='image_rejected'?'Não consegui usar essa imagem. Tente outra foto.':['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable','none'].includes(c)?'A leitura automática não está disponível aqui. Preencha manualmente.':'Não foi possível ler o cartão. Tente uma foto mais nítida ou preencha manualmente.'}}
inp.value='';R()}
function scanBox(){const bt=(l,cap)=>`<label class='chip' style='cursor:pointer;position:relative;display:inline-block;margin:0 6px 6px 0'>${l}<input type='file' accept='image/*' ${cap?`capture='environment'`:''} onchange='readCard(this)' style='position:absolute;opacity:0;width:1px;height:1px;margin:0'></label>`;
let b='';if(scan.st=='load')b=`<p class='mute'>Lendo o cartão… pode levar alguns segundos.</p>`;else if(scan.st=='err'&&scan.msg)b=`<div class='err'>${scan.msg}</div>`;else if(scan.st=='ok')b=scan.recs.length?`<p><b>${scan.recs.length} registro${scan.recs.length>1?'s':''} encontrado${scan.recs.length>1?'s':''}.</b> Confira com o cartão e desmarque o que não quiser.</p>${scan.recs.map((x,i)=>`<label class='ck'><input type='checkbox' ${x.on?'checked':''} onchange='scan.recs[${i}].on=this.checked'><span><b>${h(x.n)}</b> · ${h(x.dose)||'dose não lida'} · ${fd(x.d)}<br><span class='mute'>Lote ${h(x.lote)||'—'} · ${h(x.vet)||'vet. não lido'} · Próxima: ${fd(x.prox)}</span></span></label>`).join('')}<button class='w' onclick='addScan()'>Adicionar selecionadas ao cartão</button><p class='mute'>A leitura pode errar. Os registros entram como "Precisa confirmar".</p>`:`<div class='err'>Não encontrei vacinas nessa foto. Tente uma imagem mais nítida e bem iluminada.</div>`;
return `<div class='card' style='border-color:var(--acc)'><b>📷 Preencher com foto do cartão</b><p class='mute'>Tire uma foto ou escolha da galeria. Lemos os dados automaticamente e você confere antes de salvar. A foto não fica guardada.</p>${bt('Tirar foto',1)}${bt('Escolher da galeria',0)}${b}</div>`}
function addScan(){const p=pet(S.petId),hoje=new Date().toISOString().slice(0,10);(p.vac=p.vac||[]);scan.recs.filter(x=>x.on).forEach(x=>{p.vac.push({n:x.n,dose:x.dose,d:x.d,lote:x.lote,vet:x.vet,prox:x.prox,c:0});if(x.prox&&x.prox>=hoje)S.events.push({id:uid(),pet:p.id,tipo:'Vacina',tit:'Reforço: '+x.n,dt:x.prox+'T10:00',st:'agendado'})});scan={st:'',recs:[],msg:''};S.sheet=null;persistPet(p).catch(e=>{S.err='Falha ao sincronizar: '+e.message;R()});R()}
function nav(){const t=[['home','🏠','Início'],['pets','🐕','Pets'],['agenda','📅','Agenda'],['anuncios','📣','Anúncios']],cur=S.view=='perfil'?'pets':S.view;
return `<nav><div>${t.concat([['lojas','🏪','Comércios'],['dono','👤','Perfil']]).map(([k,i,l])=>`<button class="${cur==k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('')}</div></nav>`}
function R(){const V={auth,home,pets,perfil,agenda,anuncios,dono,lojas};let o='';
if(S.sheet){const t=S.sheet.t;o=`<div class="ov" onclick="if(event.target==this)sheet(null)"><div class="sh">${{doc:docSheet,pet:petForm,del:delSheet,ev:evForm,ad:adForm,msg:msgSheet,donoF:donoForm,pw:pwForm,acc:accSheet,vac:vacForm,shop:shopForm,shopd:shopDet,famP:famPForm,inv:invForm}[t]()}</div></div>`}
$('app').innerHTML=V[S.view]()+(S.view!='auth'?nav():'')+o;window.scrollTo(0,0)}
boot();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));}
</script></body></html>
