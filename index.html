// Lembretes do navegador: somente eventos agendados podem gerar avisos.
function reminderStorageKey(){return 'patinha_notified_'+(currentUser?.id||'guest')}
async function checkUpcomingReminders(){
 if(!currentUser||!('Notification' in window)||Notification.permission!=='granted')return;
 const key=reminderStorageKey();
 const activeEvents=S.events.filter(e=>String(e.st||'').toLowerCase()==='agendado');
 const activeIds=new Set(activeEvents.map(e=>String(e.id)));
 let sent=[];try{sent=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
 // Descarta o controle de eventos concluídos/cancelados e fecha avisos ainda visíveis.
 sent=sent.filter(id=>activeIds.has(String(id)));
 if('serviceWorker' in navigator){
  try{
   const reg=await navigator.serviceWorker.ready;
   const visible=await reg.getNotifications();
   visible.forEach(n=>{
    const id=(n.tag||'').replace(/^patinha-/,'');
    if((n.tag||'').startsWith('patinha-')&&!activeIds.has(id))n.close();
   });
  }catch(err){console.warn('Não foi possível atualizar avisos antigos:',err)}
 }
 const now=Date.now(),from=now-2*60*1000,limit=now+5*60*1000;
 for(const e of activeEvents){
  const when=new Date(e.dt).getTime();
  if(!Number.isFinite(when)||when<from||when>limit||sent.includes(String(e.id)))continue;
  const p=pet(e.pet),petName=p?.nome||'seu pet';
  const title='Lembrete do Patinha 🐾';
  const body=petName+' — '+e.tit+' ('+new Date(e.dt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+').';
  try{
   if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body,tag:'patinha-'+e.id,icon:'./icons/patinha.svg',badge:'./icons/patinha.svg'});}
   else new Notification(title,{body});
   sent.push(String(e.id));
  }catch(err){console.warn('Não foi possível exibir o lembrete:',err)}
 }
 try{localStorage.setItem(key,JSON.stringify(sent.slice(-300)))}catch(e){}
}

 R();
}

 const admin=[['home','🏠','Início'],['pets','🐾','Pets'],['agenda','📅','Agenda'],['comunidade','🐾','Comunidade'],['comercios','🏪','Comércios'],['divulgacoes','📣','Divulgações'],['planos','⭐','Planos'],['admin','🛡️','Aprovações'],['dono','👤','Perfil']];
 const t=S.isAdmin?admin:S.accountType==='merchant'?merchant:tutor,cur=S.view==='perfil'?'pets':S.view;
 return `<nav><div>${t.map(([k,i,l])=>`<button class="${cur==k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join('')}</div></nav>`
}

function communityArea(){
 const labels={adoption:'Adoção',lost:'Animal perdido',found:'Animal encontrado'};
 const cities=[...new Set(S.communityPosts.map(p=>p.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const filtered=S.communityPosts.filter(p=>(S.communityFilter==='all'||p.type===S.communityFilter)&&(S.communityCity==='all'||p.city===S.communityCity));
 const admin=S.isAdmin;
 return `<h1>Comunidade Patinha</h1><p class="mute">Divulgue adoções e ajude a reunir animais perdidos com suas famílias.</p>
 <button class="w" onclick="openCommunityForm()">＋ Criar publicação</button>
 <div class="card" style="margin-top:12px"><label for="communityType">Categoria</label><select id="communityType" onchange="S.communityFilter=this.value;R()"><option value="all" ${S.communityFilter==='all'?'selected':''}>Todas</option><option value="adoption" ${S.communityFilter==='adoption'?'selected':''}>Adoção</option><option value="lost" ${S.communityFilter==='lost'?'selected':''}>Animal perdido</option><option value="found" ${S.communityFilter==='found'?'selected':''}>Animal encontrado</option></select><label for="communityCity">Cidade</label><select id="communityCity" onchange="S.communityCity=this.value;R()"><option value="all">Todas as cidades</option>${cities.map(city=>`<option value="${h(city)}" ${S.communityCity===city?'selected':''}>${h(city)}</option>`).join('')}</select></div>
 ${filtered.length?filtered.map(p=>`<article class="card">${p.photo_url?`<img class="big" src="${h(p.photo_url)}" alt="Foto de ${h(p.pet_name)}">`:''}<div class="row sp"><b>${h(p.pet_name)}</b><span class="tag">Publicada</span></div><div class="mute">${labels[p.type]||'Publicação'} · ${h(p.species)}${p.breed?' · '+h(p.breed):''} · ${h(p.city)}</div><p>${h(p.description)}</p><div class="mute">Contato: ${h(p.contact)}</div>${(admin||p.user_id===currentUser.id)?`<button class="sm d" style="margin-top:10px" onclick="deleteCommunityPost('${p.id}')">Excluir publicação</button>`:''}</article>`).join(''):'<div class="empty">Ainda não há publicações nesta categoria. Seja o primeiro a divulgar!</div>'}
 <p class="mute" style="font-size:12px">As publicações aparecem imediatamente para todos. Publique informações corretas e mantenha o contato atualizado.</p>`;
}
function openCommunityForm(){S.sheet={t:'communityPost'};S.err='';tmpFoto='';R()}
function communityPostForm(){return `<h2>Nova publicação</h2>${S.err?`<div class="err">${h(S.err)}</div>`:''}<form onsubmit="event.preventDefault();saveCommunityPost()"><label for="cpt">Tipo de publicação</label><select id="cpt"><option value="adoption">Adoção</option><option value="lost">Animal perdido</option><option value="found">Animal encontrado</option></select><label for="cpn">Nome do animal</label><input id="cpn" maxlength="80" required><label for="cps">Espécie</label><select id="cps"><option>Cachorro</option><option>Gato</option><option>Outro</option></select><label for="cpb">Raça (opcional)</label><input id="cpb" maxlength="80"><label for="cpd">Descrição</label><textarea id="cpd" rows="4" maxlength="1200" required placeholder="Conte características, informações importantes e detalhes..."></textarea><label for="cpc">Cidade</label><input id="cpc" maxlength="100" value="${h(S.user.cidade||'')}" required><label for="cpcontact">Telefone/WhatsApp para contato</label><input id="cpcontact" maxlength="40" value="${h(S.user.tel||'')}" required>${photoField()}<button class="w">Publicar agora</button></form><button class="w g" onclick="sheet(null)">Cancelar</button>`}
async function saveCommunityPost(){
 const type=$('cpt').value,pet_name=$('cpn').value.trim(),species=$('cps').value,breed=$('cpb').value.trim(),description=$('cpd').value.trim(),city=$('cpc').value.trim(),contact=$('cpcontact').value.trim();
 if(!pet_name||!description||!city||!contact){S.err='Preencha nome, descrição, cidade e contato.';R();return}
 try{
  const id=uid();let photo_path=null;
  if(tmpFoto){const blob=await (await fetch(tmpFoto)).blob();photo_path=currentUser.id+'/community-'+id+'.jpg';const {error:uploadError}=await db.storage.from('fotos-pets').upload(photo_path,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'3600'});if(uploadError)throw uploadError}
  const {data,error}=await db.from('community_posts').insert({user_id:currentUser.id,type,pet_name,species,breed,description,city,contact,photo_path,status:'pending'}).select('*').single();
  if(error)throw error;
  if(data.photo_path){try{data.photo_url=await signedPetPhoto(data.photo_path)}catch(e){console.warn(e)}}
  S.communityPosts.unshift(data);S.sheet=null;tmpFoto='';S.msg='Publicação publicada com sucesso!';R();
 }catch(e){S.err='Não foi possível publicar: '+(e.message||'tente novamente.');R()}
}
async function moderateCommunityPost(id,status){
 if(!S.isAdmin||!['approved','rejected'].includes(status))return;
 const {error}=await db.from('community_posts').update({status}).eq('id',id);
 if(error){S.err='Não foi possível moderar a publicação: '+error.message;R();return}
 const post=S.communityPosts.find(p=>p.id===id);if(post)post.status=status;
 S.msg=status==='approved'?'Publicação aprovada.':'Publicação rejeitada.';R();
}
async function deleteCommunityPost(id){
 if(!confirm('Excluir esta publicação?'))return;
 const {error}=await db.from('community_posts').delete().eq('id',id);
 if(error){S.err='Não foi possível excluir: '+error.message;R();return}
 S.communityPosts=S.communityPosts.filter(p=>p.id!==id);S.msg='Publicação excluída.';R();
}

function planos(){
 const showTutor=S.accountType!=='merchant'||S.isAdmin;
 const showCommercial=S.accountType==='merchant'||S.isAdmin;
 return `<h1>Planos do Patinha</h1><p class="mute">Escolha como deseja utilizar o Patinha. Nesta etapa, as opções são apenas demonstrativas: ainda não há cobrança nem contratação ativa.</p>
 ${showTutor?`<div class="card"><div class="row sp"><b>Patinha Tutor</b><span class="tag">Gratuito</span></div><h2 style="font-size:28px;margin:10px 0">R$ 0,00</h2><p>Cuide da rotina do seu pet sem mensalidade.</p><ul><li>Cadastro e organização dos pets</li><li>Agenda de vacinas e medicamentos</li><li>Histórico de cuidados</li><li>Busca por estabelecimentos e divulgações</li></ul><button class="w s" disabled>Plano gratuito</button></div>
 <div class="card"><div class="row sp"><b>Patinha Premium</b><span class="tag p">Em planejamento</span></div><h2 style="font-size:28px;margin:10px 0">Em breve</h2><p>Recursos adicionais para organizar os cuidados dos seus pets.</p><ul><li>Relatórios e recursos avançados</li><li>Histórico ampliado</li><li>Funcionalidades exclusivas futuras</li></ul><button class="w s" disabled>Disponível futuramente</button></div>`:''}
 ${showCommercial?`<div class="card"><div class="row sp"><b>Patinha Comercial</b><span class="tag">Gratuito</span></div><h2 style="font-size:28px;margin:10px 0">R$ 0,00</h2><p>Comece a divulgar seu estabelecimento no Patinha.</p><ul><li>Cadastro do estabelecimento</li><li>Perfil comercial</li><li>1 divulgação ativa</li><li>Perfil do estabelecimento</li></ul><button class="w s" disabled>Plano gratuito atual</button></div>
 <div class="card"><div class="row sp"><b>Patinha Pro</b><span class="tag p">Em planejamento</span></div><h2 style="font-size:28px;margin:10px 0">R$ 29,90 <span class="mute">/ mês (valor sugerido)</span></h2><p>Mais ferramentas para ampliar a presença do seu negócio.</p><ul><li>Até 10 divulgações ativas</li><li>Anúncios em destaque</li><li>Estatísticas de visualizações</li><li>Maior visibilidade nas buscas</li></ul><button class="w s" disabled>Assinatura em breve</button></div>`:''}
 <div class="mute" style="margin-top:12px">Os valores e benefícios ainda serão validados. Nenhum pagamento será solicitado nesta versão.</div>`;
}
function businessArea(){
 const b=S.business;
 if(!b)return `<h1>Área do comerciante</h1><div class="err">Não encontramos uma solicitação comercial para esta conta.</div>`;
 if(b.status==='pending')return `<h1>Solicitação em análise</h1><div class="card"><div style="font-size:36px">⏳</div><b>${h(b.business_name)}</b><p class="mute">Sua solicitação foi recebida e está aguardando aprovação da equipe Patinha. A área de divulgação será liberada após a aprovação.</p><span class="tag p">Em análise</span></div><button class="s w" onclick="doLogout()">Sair</button>`;
 if(b.status==='rejected')return `<h1>Solicitação não aprovada</h1><div class="card"><b>${h(b.business_name)}</b><p class="mute">Sua solicitação não foi aprovada. Entre em contato com a equipe Patinha para saber como regularizar o cadastro.</p><span class="tag c">Não aprovada</span></div>`;
 if(b.status!=='approved')return `<h1>Área do comerciante</h1><div class="err">Status comercial inválido. Entre em contato com o suporte.</div>`;
 const activeCount=S.businessAds.length,isPro=b.plan==='commercial_pro',limit=isPro?10:1,planName=isPro?'Patinha Pro':'Patinha Comercial',limitReached=activeCount>=limit;
 return `<div class="row sp"><h1>Meu comércio</h1><span class="tag">Aprovado</span></div>
 <div class="card"><b>${h(b.business_name)}</b><div class="mute">${h(b.category)} · ${h(b.city)}</div><p>${h(b.description||'')}</p><div class="mute">Contato: ${h(b.phone)}</div></div>
 <div class="card"><div class="row sp"><b>${planName}</b><span class="tag">${activeCount}/${limit} divulgações ativas</span></div><p class="mute">${isPro?'Seu plano Pro permite manter até 10 divulgações ativas.':'Seu plano gratuito permite manter 1 divulgação ativa. O Patinha Pro ainda não está disponível para contratação.'}</p>${limitReached?`<div class="mute">Você atingiu o limite do ${isPro?'Patinha Pro':'plano gratuito'}. Exclua uma divulgação para liberar espaço.</div>`:''}</div>
 <div class="row sp"><h2>Minhas divulgações</h2><button class="sm" ${limitReached?'disabled title="Limite do plano gratuito atingido"':''} onclick="openBusinessAdForm()">+ Nova divulgação</button></div>
 ${S.businessAds.length?S.businessAds.map(ad=>`<div class="card"><b>${h(ad.title)}</b><div class="tag">${h(ad.category)}</div><p>${h(ad.description)}</p><button class="sm d" onclick="deleteBusinessAd('${ad.id}')">Excluir</button></div>`).join(''):'<div class="empty">Você ainda não publicou divulgações.</div>'}`;
}
function openBusinessAdForm(){const limit=S.business?.plan==='commercial_pro'?10:1;if(S.businessAds.length>=limit){S.err=`Limite atingido: ${S.business?.plan==='commercial_pro'?'o Patinha Pro permite até 10':'o plano gratuito permite 1'} divulgação(ões) ativa(s).`;R();return}S.sheet={t:'businessAd'};S.err='';R()}
function businessAdForm(){const limit=S.business?.plan==='commercial_pro'?10:1;return `<h2>Nova divulgação</h2><p class="mute">${limit===10?'Patinha Pro: até 10 divulgações ativas.':'Plano gratuito: 1 divulgação ativa.'}</p>${S.err?`<div class="err">${h(S.err)}</div>`:''}<form onsubmit="event.preventDefault();saveBusinessAd()"><label for="bat">Título</label><input id="bat" maxlength="100" required><label for="bac">Categoria</label><select id="bac"><option>Produto</option><option>Serviço</option><option>Promoção</option><option>Evento</option></select><label for="bad">Descrição</label><textarea id="bad" rows="4" maxlength="1000" required></textarea><button class="w">Salvar divulgação</button></form><button class="w g" onclick="sheet(null)">Cancelar</button>`}
async function saveBusinessAd(){
 const title=$('bat').value.trim(),category=$('bac').value,description=$('bad').value.trim();
 if(!title||!description)return S.err='Informe o título e a descrição.',R();
 if(!S.business||S.business.status!=='approved')return S.err='Sua conta comercial ainda não está aprovada.',R();
 const adsLimit=S.business?.plan==='commercial_pro'?10:1;if(S.businessAds.length>=adsLimit)return S.err=`Limite atingido: este plano permite ${adsLimit} divulgação(ões) ativa(s).`,R();
 try{const {data,error}=await db.from('business_ads').insert({user_id:currentUser.id,title,category,description}).select('*').single();if(error)throw error;S.businessAds.unshift(data);S.sheet=null;S.err='';S.msg='Divulgação salva com sucesso.';R()}
 catch(e){S.err='Não foi possível salvar a divulgação: '+(e.message||'tente novamente.');R()}
}
async function deleteBusinessAd(id){
 if(!confirm('Excluir esta divulgação?'))return;
 const {error}=await db.from('business_ads').delete().eq('id',id).eq('user_id',currentUser.id);
 if(error){S.err='Não foi possível excluir: '+error.message;R();return}
 S.businessAds=S.businessAds.filter(ad=>ad.id!==id);S.msg='Divulgação excluída.';R();
}
function adminBusinessArea(){
 const list=S.businessProfiles||[];
 return `<h1>Comércios cadastrados</h1><p class="mute">Visualize os estabelecimentos, acompanhe a situação e gerencie os planos.</p>${list.length?list.map(b=>`<div class="card"><div class="row sp"><b>${h(b.business_name)}</b><span class="tag ${b.status==='approved'?'':b.status==='rejected'?'c':'p'}">${b.status==='approved'?'Aprovado':b.status==='rejected'?'Rejeitado':'Pendente'}</span></div><div class="mute">${h(b.category)} · ${h(b.city)}</div><p>${h(b.description||'')}</p><div class="mute">Telefone: ${h(b.phone)}</div><div class="row sp" style="margin-top:10px"><label>Plano <select onchange="adminSetBusinessPlan('${b.user_id}',this.value)"><option value="commercial_free" ${(b.plan||'commercial_free')==='commercial_free'?'selected':''}>Patinha Comercial — Gratuito</option><option value="commercial_pro" ${b.plan==='commercial_pro'?'selected':''}>Patinha Pro</option></select></label>${b.status==='pending'?`<span><button class="sm" onclick="adminSetBusinessStatus('${b.user_id}','approved')">Aprovar</button> <button class="sm d" onclick="adminSetBusinessStatus('${b.user_id}','rejected')">Rejeitar</button></span>`:b.status==='rejected'?`<button class="sm" onclick="adminSetBusinessStatus('${b.user_id}','approved')">Reaprovar</button>`:''}</div></div>`).join(''):'<div class="empty">Nenhum comércio cadastrado.</div>'}`;
}
async function adminSetBusinessPlan(userId,plan){
 if(!S.isAdmin||!['commercial_free','commercial_pro'].includes(plan))return;
 const {error}=await db.from('business_profiles').update({plan}).eq('user_id',userId);
 if(error){S.err='Não foi possível alterar o plano: '+error.message;R();return}
 const b=S.businessProfiles.find(x=>x.user_id===userId);if(b)b.plan=plan;
 S.msg=plan==='commercial_pro'?'Plano Patinha Pro ativado.':'Plano gratuito ativado.';R();
}
async function adminSetBusinessStatus(userId,status){
 if(!S.isAdmin||!['approved','rejected'].includes(status))return;
 const {error}=await db.from('business_profiles').update({status}).eq('user_id',userId);
 if(error){S.err='Não foi possível atualizar o comércio: '+error.message;R();return}
 const b=S.businessProfiles.find(x=>x.user_id===userId);if(b)b.status=status;
 S.msg=status==='approved'?'Comércio aprovado.':'Comércio rejeitado.';R();
}
function adminAdsArea(){
 const profiles=S.businessProfiles||[],ads=S.adminAds||[];
 return `<h1>Divulgações</h1><p class="mute">Visualize e modere as divulgações publicadas pelos comerciantes.</p>${ads.length?ads.map(ad=>{const b=profiles.find(x=>x.user_id===ad.user_id);return `<div class="card"><b>${h(ad.title)}</b><div class="tag">${h(ad.category)}</div><p>${h(ad.description)}</p><div class="mute">Comércio: ${h(b?.business_name||'Cadastro não localizado')}</div><button class="sm d" style="margin-top:10px" onclick="adminDeleteAd('${ad.id}')">Excluir divulgação</button></div>`}).join(''):'<div class="empty">Nenhuma divulgação publicada.</div>'}`;
}
async function adminDeleteAd(id){
 if(!S.isAdmin||!confirm('Excluir esta divulgação permanentemente?'))return;
 const {error}=await db.from('business_ads').delete().eq('id',id);
 if(error){S.err='Não foi possível excluir a divulgação: '+error.message;R();return}
 S.adminAds=S.adminAds.filter(ad=>String(ad.id)!==String(id));S.msg='Divulgação excluída.';R();
}
async function adminArea(){
 const {data,error}=await db.from('business_profiles').select('*').eq('status','pending').order('created_at',{ascending:true});
 if(error)return `<h1>Aprovações</h1><div class="err">Não foi possível carregar solicitações: ${h(error.message)}</div>`;
 return `<h1>Solicitações comerciais</h1><p class="mute">Confira os dados antes de aprovar. Somente o administrador pode liberar a divulgação.</p>
 ${data?.length?data.map(b=>`<div class="card"><b>${h(b.business_name)}</b><div class="mute">${h(b.category)} · ${h(b.city)}</div><p>${h(b.description||'')}</p><div class="mute">Telefone: ${h(b.phone)}</div><div class="row"><button class="sm" onclick="setBusinessStatus('${b.user_id}','approved')">Aprovar</button><button class="sm d" onclick="setBusinessStatus('${b.user_id}','rejected')">Rejeitar</button></div></div>`).join(''):'<div class="empty">Não há solicitações pendentes.</div>'}`;
}
async function setBusinessStatus(userId,status){
 if(!S.isAdmin||!['approved','rejected'].includes(status))return;
 const {error}=await db.from('business_profiles').update({status}).eq('user_id',userId);
 if(error){S.err='Não foi possível atualizar a solicitação: '+error.message;R();return}
 S.msg=status==='approved'?'Comerciante aprovado.':'Solicitação rejeitada.';R();
}
function R(){if(currentUser){if(S.accountType==='merchant'&&!S.isAdmin&&!['comercio','dono','planos'].includes(S.view))S.view='comercio';if(S.isAdmin&&!['home','pets','agenda','perfil','dono','admin','comercios','divulgacoes','comunidade','planos'].includes(S.view))S.view='home';if(S.accountType==='tutor'&&!S.isAdmin&&!['home','pets','agenda','perfil','dono','planos','comunidade'].includes(S.view))S.view='home'}const V={auth,home,pets,perfil,agenda,dono,planos,comunidade:communityArea,comercio:businessArea,comercios:adminBusinessArea,divulgacoes:adminAdsArea,admin:()=>'<div id="adminContent"></div>'};let o='';
 if(S.sheet){const t=S.sheet.t;o=`<div class="ov" onclick="if(event.target==this)sheet(null)"><div class="sh">${{doc:docSheet,pet:petForm,del:delSheet,ev:evForm,donoF:donoForm,pw:pwForm,acc:accSheet,vac:vacForm,businessAd:businessAdForm,communityPost:communityPostForm,famP:famPForm,inv:invForm}[t]()}</div></div>`}
 $('app').innerHTML=V[S.view]()+(S.view!=='auth'?nav():'')+o;window.scrollTo(0,0);
 if(S.view==='admin')adminArea().then(html=>{const el=$('adminContent');if(el)el.innerHTML=html});
}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){S.view='auth';S.mode='reset';S.err='';S.msg='';S.sheet=null;R()}});
boot();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").then(()=>checkUpcomingReminders()).catch(console.error));}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpcomingReminders()});
setInterval(checkUpcomingReminders,60*1000);
</script></body></html>
